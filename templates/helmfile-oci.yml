spec:
  inputs:
    compose-file:
      description: Path to the caller's top-level Compose file.
    env-file:
      description: Compose and Helmfile validation dotenv file; defaults to .env beside the Compose file.
      default: ''
    include-env-file-in-bundle:
      description: Copy the selected dotenv file to .env at the root of the archived bundle.
      type: boolean
      default: false
    chart-map:
      description: Optional caller-owned chart mapping.
      default: ''
    profiles:
      description: Comma-separated default Compose profiles.
      default: ''
    output-dir:
      description: Caller-relative directory replaced by generated files.
    helmfile-entrypoint:
      description: Helmfile to validate; defaults to <output-dir>/helmfile.yaml.
      default: ''
    bundle-dir:
      description: Directory archived after validation; defaults to output-dir.
      default: ''
    active-profiles-only:
      description: Export only services in the selected profiles.
      type: boolean
      default: false
    artifact-name:
      description: Job artifact and archive name prefix.
      default: helmfile
    job-name:
      description: Name of the generated job.
      default: helmfile
    stage:
      description: Stage of the generated job.
      default: build
    openads-helm-repository:
      description: Git repository providing utils/helmfile-generator.
      default: https://github.com/openads-project/openads-helm.git
    openads-helm-ref:
      description: Branch, tag, or commit of openads-helm-repository; use the same revision as this component.
      default: main
---

"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: python:3.12-slim
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    COMPOSE_FILE_INPUT: "$[[ inputs.compose-file ]]"
    ENV_FILE_INPUT: "$[[ inputs.env-file ]]"
    INCLUDE_ENV_FILE_IN_BUNDLE: "$[[ inputs.include-env-file-in-bundle ]]"
    CHART_MAP_INPUT: "$[[ inputs.chart-map ]]"
    PROFILES_INPUT: "$[[ inputs.profiles ]]"
    OUTPUT_DIR_INPUT: "$[[ inputs.output-dir ]]"
    HELMFILE_ENTRYPOINT_INPUT: "$[[ inputs.helmfile-entrypoint ]]"
    BUNDLE_DIR_INPUT: "$[[ inputs.bundle-dir ]]"
    ACTIVE_PROFILES_ONLY_INPUT: "$[[ inputs.active-profiles-only ]]"
    ARTIFACT_NAME: "$[[ inputs.artifact-name ]]"
    OPENADS_HELM_REPOSITORY: "$[[ inputs.openads-helm-repository ]]"
    OPENADS_HELM_REF: "$[[ inputs.openads-helm-ref ]]"
  before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends ca-certificates curl git
  - |-
    # Set up Docker Compose, Helm, Helmfile, and ORAS
    set -euo pipefail
    curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.7.2.tgz \
    | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
    mkdir -p /usr/local/lib/docker/cli-plugins
    curl -fsSLo /usr/local/lib/docker/cli-plugins/docker-compose \
      https://github.com/docker/compose/releases/download/v5.5.0/docker-compose-linux-x86_64
    chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
    curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz \
    | tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
    curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.1.7/helmfile_1.1.7_linux_amd64.tar.gz \
    | tar -xz -C /usr/local/bin helmfile
    curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz \
    | tar -xz -C /usr/local/bin oras
    docker compose version
  - |-
    # Check out the Helmfile generator
    set -euo pipefail
    git init --quiet /opt/openads-helm
    git -C /opt/openads-helm fetch --quiet --depth 1 "$OPENADS_HELM_REPOSITORY" "$OPENADS_HELM_REF"
    git -C /opt/openads-helm checkout --quiet FETCH_HEAD
    python -m pip install --disable-pip-version-check -r /opt/openads-helm/utils/helmfile-generator/requirements.txt
  script:
  - |-
    # Load validation environment
    set -euo pipefail
    generator_dir=/opt/openads-helm/utils/helmfile-generator
    workspace="$(realpath "$CI_PROJECT_DIR")"
    validation_env="$(mktemp)"
    arguments=(
      --compose-file "$COMPOSE_FILE_INPUT"
      --profiles "$PROFILES_INPUT"
      --workspace "$workspace"
      --shell-env "$validation_env"
    )
    if [[ -n "$ENV_FILE_INPUT" ]]; then
      arguments+=(--env-file "$ENV_FILE_INPUT")
    fi
    python "$generator_dir/ci_environment.py" "${arguments[@]}"
    . "$validation_env"
    rm -f -- "$validation_env"
  - |-
    # Generate Helmfile
    set -euo pipefail
    generated_dir="$(realpath --canonicalize-missing "$OUTPUT_DIR_INPUT")"
    if [[ "$generated_dir" == "$workspace" || "$generated_dir" != "$workspace/"* ]]; then
      echo "Output directory must be below the caller workspace: $OUTPUT_DIR_INPUT" >&2
      exit 1
    fi
    rm -rf -- "$generated_dir"

    arguments=(
      "$COMPOSE_FILE_INPUT"
      --output-dir "$generated_dir"
    )
    if [[ -n "$ENV_FILE_INPUT" ]]; then
      arguments+=(--env-file "$ENV_FILE_INPUT")
    fi
    if [[ -n "$CHART_MAP_INPUT" ]]; then
      arguments+=(--chart-map "$CHART_MAP_INPUT")
    fi
    if [[ "$ACTIVE_PROFILES_ONLY_INPUT" == "true" ]]; then
      arguments+=(--active-profiles-only)
    fi

    while IFS= read -r profile; do
      profile="${profile#"${profile%%[![:space:]]*}"}"
      profile="${profile%"${profile##*[![:space:]]}"}"
      if [[ -n "$profile" ]]; then
        arguments+=(--profile "$profile")
      fi
    done < <(printf '%s' "$PROFILES_INPUT" | tr ',' '\n')

    python "$generator_dir/helmfile_generator.py" "${arguments[@]}"

    dotenv_file="${ENV_FILE_INPUT:-$(dirname "$COMPOSE_FILE_INPUT")/.env}"
    dotenv_name="$(basename "$dotenv_file")"
    if find "$generated_dir" -type f -name "$dotenv_name" -print -quit | grep -q .; then
      echo "Generated output contains input dotenv file: $dotenv_name" >&2
      exit 1
    fi
  - |-
    # Resolve Helmfile bundle
    set -euo pipefail
    bundle_dir="$(realpath "${BUNDLE_DIR_INPUT:-$generated_dir}")"
    helmfile_entrypoint="$(realpath "${HELMFILE_ENTRYPOINT_INPUT:-$generated_dir/helmfile.yaml}")"

    if [[ "$bundle_dir" == "$workspace" || "$bundle_dir" != "$workspace/"* ]]; then
      echo "Bundle directory must be below the caller workspace: $bundle_dir" >&2
      exit 1
    fi
    if [[ ! -d "$bundle_dir" ]]; then
      echo "Bundle directory not found: $bundle_dir" >&2
      exit 1
    fi
    if [[ "$generated_dir" != "$bundle_dir" && "$generated_dir" != "$bundle_dir/"* ]]; then
      echo "Generated directory must be inside the bundle: $generated_dir" >&2
      exit 1
    fi
    if [[ ! -f "$helmfile_entrypoint" || "$helmfile_entrypoint" != "$bundle_dir/"* ]]; then
      echo "Helmfile entrypoint must be a file inside the bundle: $helmfile_entrypoint" >&2
      exit 1
    fi
    if [[ "$INCLUDE_ENV_FILE_IN_BUNDLE" == "true" ]]; then
      dotenv_file="$(realpath "${ENV_FILE_INPUT:-$(dirname "$COMPOSE_FILE_INPUT")/.env}")"
      if [[ ! -f "$dotenv_file" || "$dotenv_file" != "$workspace/"* ]]; then
        echo "Environment file must be a file inside the caller workspace: $dotenv_file" >&2
        exit 1
      fi
      bundled_env="$bundle_dir/.env"
      if [[ "$dotenv_file" != "$bundled_env" ]]; then
        cp -- "$dotenv_file" "$bundled_env"
      fi
    fi
  - |-
    # Build Helmfile state and template Helmfile releases
    set -euo pipefail
    (
      cd "$(dirname "$helmfile_entrypoint")"
      helmfile --file "$(basename "$helmfile_entrypoint")" build
      helmfile --file "$(basename "$helmfile_entrypoint")" template
    )
  - |-
    # Create reproducible archive
    set -euo pipefail
    if [[ ! "$ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
      echo "Invalid artifact name: $ARTIFACT_NAME" >&2
      exit 1
    fi
    archive_name="${ARTIFACT_NAME}-${CI_COMMIT_SHA}.tar.gz"
    archive_path="${workspace}/${archive_name}"
    tar \
      --sort=name \
      --mtime='@0' \
      --owner=0 \
      --group=0 \
      --numeric-owner \
      --directory "$bundle_dir" \
      --create \
      --file - \
      . | gzip --no-name > "$archive_path"
    archive_digest="$(sha256sum "$archive_path" | cut -d' ' -f1)"
    echo "${archive_digest}  ${archive_path}"
  - |-
    # Determine OCI publication
    set -euo pipefail
    oci_reference="${CI_REGISTRY_IMAGE:+${CI_REGISTRY_IMAGE}/helmfile}"
    publish=false
    tags=()
    if [[ "$CI_PIPELINE_SOURCE" == "push" && "${CI_COMMIT_BRANCH:-}" == "$CI_DEFAULT_BRANCH" ]]; then
      publish=true
      tags+=("${CI_DEFAULT_BRANCH//\//-}" "sha-${CI_COMMIT_SHA}")
    elif [[ "$CI_PIPELINE_SOURCE" == "push" && "${CI_COMMIT_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      publish=true
      tags+=("$CI_COMMIT_TAG" "sha-${CI_COMMIT_SHA}")
    fi
    if [[ "$publish" == "true" && -z "$oci_reference" ]]; then
      echo "Container registry is disabled for ${CI_PROJECT_PATH}; skipping OCI publication" >&2
      publish=false
    fi

    {
      echo "OPENADS_HELMFILE_ARTIFACT_NAME=${ARTIFACT_NAME}"
      echo "OPENADS_HELMFILE_ARCHIVE_NAME=${archive_name}"
      echo "OPENADS_HELMFILE_ARCHIVE_PATH=${archive_name}"
      echo "OPENADS_HELMFILE_ARCHIVE_DIGEST=${archive_digest}"
      echo "OPENADS_HELMFILE_OUTPUT_DIR=${OUTPUT_DIR_INPUT}"
      echo "OPENADS_HELMFILE_ENTRYPOINT=$(realpath --relative-to "$workspace" "$helmfile_entrypoint")"
      echo "OPENADS_HELMFILE_BUNDLE_DIR=$(realpath --relative-to "$workspace" "$bundle_dir")"
      echo "OPENADS_HELMFILE_OCI_REFERENCE=${oci_reference}"
    } > "${workspace}/helmfile-oci.env"
  - |-
    # Publish OCI artifact
    set -euo pipefail
    if [[ "$publish" == "true" ]]; then
      printf '%s' "$CI_REGISTRY_PASSWORD" | oras login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      tag_list="$(IFS=,; printf '%s' "${tags[*]}")"
      oras push \
        --artifact-type application/vnd.openads.helmfile.v1 \
        --annotation "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --annotation "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        "${oci_reference}:${tag_list}" \
        "${archive_name}:application/vnd.openads.helmfile.layer.v1.tar+gzip"
    fi
  artifacts:
    name: $[[ inputs.artifact-name ]]
    paths:
    - $[[ inputs.artifact-name ]]-${CI_COMMIT_SHA}.tar.gz
    expire_in: 7 days
    reports:
      dotenv: helmfile-oci.env
