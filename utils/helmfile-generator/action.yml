name: Helmfile generator
description: Generate Helmfile state from a Docker Compose project.

inputs:
  compose-file:
    description: Path to the top-level Compose file in the caller repository.
    required: true
  env-file:
    description: Compose and Helmfile validation environment; defaults to .env beside the Compose file.
    required: false
    default: ""
  chart-map:
    description: Optional project-specific chart mapping.
    required: false
    default: ""
  profiles:
    description: Comma-separated default Compose profiles.
    required: false
    default: ""
  active-profiles-only:
    description: Export only services in the selected profiles.
    required: false
    default: "false"
  output-dir:
    description: Destination below the caller workspace and later extraction location.
    required: true

outputs:
  output-dir:
    description: Absolute generated Helmfile directory.
    value: ${{ steps.generate.outputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ${{ github.action_path }}/requirements.txt

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.19.0

    - name: Install generator dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Check Docker Compose
      shell: bash
      run: docker compose version

    - name: Load validation environment
      shell: bash
      env:
        COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        ENV_FILE_INPUT: ${{ inputs.env-file }}
        CHART_MAP_INPUT: ${{ inputs.chart-map }}
        PROFILES_INPUT: ${{ inputs.profiles }}
      run: |
        set -euo pipefail
        arguments=(
          --compose-file "$COMPOSE_FILE_INPUT"
          --profiles "$PROFILES_INPUT"
          --workspace "$GITHUB_WORKSPACE"
          --github-env "$GITHUB_ENV"
        )
        if [[ -n "$ENV_FILE_INPUT" ]]; then
          arguments+=(--env-file "$ENV_FILE_INPUT")
        fi
        if [[ -n "$CHART_MAP_INPUT" ]]; then
          arguments+=(--chart-map "$CHART_MAP_INPUT")
        fi
        python "$GITHUB_ACTION_PATH/ci_environment.py" "${arguments[@]}"

    - name: Generate Helmfile
      id: generate
      shell: bash
      env:
        ACTIVE_PROFILES_ONLY_INPUT: ${{ inputs.active-profiles-only }}
        CHART_MAP_INPUT: ${{ inputs.chart-map }}
        COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        ENV_FILE_INPUT: ${{ inputs.env-file }}
        OUTPUT_DIR_INPUT: ${{ inputs.output-dir }}
        PROFILES_INPUT: ${{ inputs.profiles }}
      run: |
        set -euo pipefail
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        output_dir="$(realpath --canonicalize-missing "$OUTPUT_DIR_INPUT")"
        if [[ "$output_dir" == "$workspace" || "$output_dir" != "$workspace/"* ]]; then
          echo "Output directory must be below the caller workspace: $OUTPUT_DIR_INPUT" >&2
          exit 1
        fi
        rm -rf -- "$output_dir"

        arguments=(
          "$COMPOSE_FILE_INPUT"
          --output-dir "$output_dir"
        )
        if [[ -n "$ENV_FILE_INPUT" ]]; then
          arguments+=(--env-file "$ENV_FILE_INPUT")
        fi
        if [[ -n "$CHART_MAP_INPUT" ]]; then
          arguments+=(--chart-map "$CHART_MAP_INPUT")
        fi
        if [[ "$ACTIVE_PROFILES_ONLY_INPUT" == "true" ]]; then
          arguments+=(--active-profiles-only)
        fi

        while IFS= read -r profile; do
          profile="${profile#"${profile%%[![:space:]]*}"}"
          profile="${profile%"${profile##*[![:space:]]}"}"
          if [[ -n "$profile" ]]; then
            arguments+=(--profile "$profile")
          fi
        done < <(printf '%s' "$PROFILES_INPUT" | tr ',' '\n')

        python "$GITHUB_ACTION_PATH/helmfile_generator.py" "${arguments[@]}"

        dotenv_file="${ENV_FILE_INPUT:-$(dirname "$COMPOSE_FILE_INPUT")/.env}"
        dotenv_name="$(basename "$dotenv_file")"
        if find "$output_dir" -type f -name "$dotenv_name" -print -quit | grep -q .; then
          echo "Generated output contains input dotenv file: $dotenv_name" >&2
          exit 1
        fi

        echo "output-dir=$output_dir" >> "$GITHUB_OUTPUT"
