name: test

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  tcp-gateway-netem:
    name: Test tcp-gateway-netem
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: azure/setup-helm@v4
      with:
        version: v3.18.4
    - run: python -m pip install PyYAML
    - run: python -m unittest discover -s charts/tcp-gateway-netem/tests -v
    - run: helm lint charts/tcp-gateway-netem

  cpu-pool-control:
    name: Test cpu-pool-control
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: azure/setup-helm@v4
      with:
        version: v3.18.4
    - run: python -m pip install PyYAML
    - run: python -m unittest discover -s charts/cpu-pool-control/tests -v
    - run: helm lint charts/cpu-pool-control
