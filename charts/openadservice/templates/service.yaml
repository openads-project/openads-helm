{{- $hasInstances := gt (len .Values.instances) 0 }}
{{- $instances := .Values.instances | default (dict "" (dict)) }}
{{- range $instanceKey, $instance := $instances }}
{{- $values := mergeOverwrite (deepCopy $.Values) $instance }}
{{- $baseName := include "openadservice.baseName" (dict "name" $.Values.name "releaseName" $.Release.Name "namePrefix" $.Values.namePrefix) }}
{{- $name := include "openadservice.instanceName" (dict "baseName" $baseName "instanceKey" $instanceKey "hasInstances" $hasInstances) }}
{{- if and $values.enable $values.enableService }}
{{- if $values.ports }}
apiVersion: v1
kind: Service
{{- $externalName := printf "%s-external" $name }}
metadata:
  name: "{{ $externalName }}"
  labels:
    app.kubernetes.io/name: "{{ $externalName }}"
    {{- range $key, $value := $values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ $name }}"
  type: NodePort
  ports:
    {{- range $values.ports }}
    - name: "{{ .protocol | default "TCP" | lower }}-{{ .port }}-{{ .targetPort }}"
      nodePort: {{ .nodePort }}
      port: {{ .port | default .targetPort }}
      targetPort: {{ .targetPort }}
      protocol: "{{ .protocol | default "TCP" }}"
    {{- end }}
---
{{- end }}
{{- if $values.expose }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ $name }}"
  labels:
    app.kubernetes.io/name: "{{ $name }}"
    {{- range $key, $value := $values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ $name }}"
  type: ClusterIP
  ports:
    {{- range $values.expose }}
    - name: "{{ .protocol | default "TCP" | lower }}-{{ .port }}-{{ .targetPort }}"
      port: {{ .port | default .targetPort }}
      targetPort: {{ .targetPort }}
      protocol: "{{ .protocol | default "TCP" }}"
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
