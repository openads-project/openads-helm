{{- if .Values.enable }}
{{- if .Values.enableService }}
{{- if .Values.ports }}
apiVersion: v1
kind: Service
{{- $name := printf "%s-external" (.Values.name | default .Release.Name) }}
metadata:
  name: "{{ $name }}"
  labels:
    app.kubernetes.io/name: "{{ $name }}"
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ .Values.name | default .Release.Name }}"
  type: NodePort
  ports:
    {{- range .Values.ports }}
    - name: "{{ .protocol | default "TCP" | lower }}-{{ .port }}-{{ .targetPort }}"
      nodePort: {{ .nodePort }}
      port: {{ .port | default .targetPort }}
      targetPort: {{ .targetPort }}
      protocol: "{{ .protocol | default "TCP" }}"
    {{- end }}
{{- end }}
---
{{- if .Values.expose }}
apiVersion: v1
kind: Service
{{- $name := .Values.name | default .Release.Name }}
metadata:
  name: "{{ $name }}"
  labels:
    app.kubernetes.io/name: "{{ $name }}"
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ .Values.name | default .Release.Name }}"
  type: ClusterIP
  ports:
    {{- range .Values.expose }}
    - name: "{{ .protocol | default "TCP" | lower }}-{{ .port }}-{{ .targetPort }}"
      port: {{ .port | default .targetPort }}
      targetPort: {{ .targetPort }}
      protocol: "{{ .protocol | default "TCP" }}"
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
