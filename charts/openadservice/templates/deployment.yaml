{{- if .Values.enable }}
{{- if .Values.enableDeployment }}
apiVersion: apps/v1
kind: Deployment
{{- $name := .Values.name | default .Release.Name }}
metadata:
  name: "{{ $name }}"
  labels:
    app.kubernetes.io/name: "{{ $name }}"
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ $name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ $name }}"
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: "{{ . }}"
      {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 5 # TODO: better signal handling in docker-ros images would be preferred?
      {{- if .Values.gpu }}
      runtimeClassName: nvidia
      {{- end }}
      {{- if or .Values.dependsOn .Values.initContainers }}
      initContainers:
      {{- range $dependency := .Values.dependsOn }}
      - name: "{{ include "rfc1123CompliantName" (printf "%s-wait-for-%s-%v" $name $dependency.host $dependency.port) }}"
        image: busybox:1.36
        command:
          - sh
          - -ec
          - >
            until nc -z {{ $dependency.host }} {{ $dependency.port }};
            do echo "waiting for '{{ $dependency.host }}:{{ $dependency.port }}'"; sleep 1; done
      {{- end }}
      {{- with .Values.initContainers }}
      {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: "{{ $name }}"
        image: "{{ .Values.image }}"
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        {{- with .Values.command }}
        command:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.args }}
        args:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.shm }}
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        {{- end }}
        env:
        {{- if .Values.gpu }}
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "all"
        {{- end }}
        {{- if .Values.x11Display }}
        - name: DISPLAY
          value: "{{ .Values.x11Display }}"
        - name: XAUTHORITY
          value: /.Xauthority
        {{- end }}
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        volumeMounts:
        - name: timezone
          mountPath: /etc/timezone
        - name: localtime
          mountPath: /etc/localtime
        {{- if .Values.shm }}
        - name: shared-memory
          mountPath: /dev/shm
        {{- end }}
        {{- if .Values.x11XauthorityFile }}
        - name: x11-unix
          mountPath: /tmp/.X11-unix
        - name: xauthority
          mountPath: /.Xauthority
        {{- end }}
        - name: "{{ include "rfc1123CompliantName" ("DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5") }}"
          mountPath: /opt/ros/jazzy/share/rmw_zenoh_cpp/config/DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5
          subPath: DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5
        {{- if and .Values.rosParamFileMountPath .Values.rosParamFileData }}
        - name: "{{ include "rfc1123CompliantName" (.Values.rosParamFileMountPath | base) }}"
          mountPath: "{{ .Values.rosParamFileMountPath }}"
          subPath: "{{ .Values.rosParamFileMountPath | base }}"
        {{- end }}
        {{- range .Values.volumes }}
        {{- if or (and .data (not (empty (tpl .data $)))) .hostPath }}
        - name: "{{ include "rfc1123CompliantName" (.mountPath | base) }}"
          mountPath: "{{ .mountPath }}"
        {{- if .data }}
          subPath: "{{ .mountPath | base }}"
        {{- end }}
        {{- end }}
        {{- end }}
      volumes:
      - name: timezone
        hostPath:
          path: /etc/timezone
      - name: localtime
        hostPath:
          path: /etc/localtime
      {{- if .Values.shm }}
      - name: shared-memory
        hostPath:
          path: /dev/shm
          type: Directory
      {{- end }}
      {{- if .Values.x11XauthorityFile }}
      - name: x11-unix
        hostPath:
          path: /tmp/.X11-unix
      - name: xauthority
        hostPath:
          path: "{{ .Values.x11XauthorityFile }}"
      {{- end }}
      - name: "{{ include "rfc1123CompliantName" ("DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5") }}"
        configMap:
          name: "{{ include "rfc1123CompliantName" (printf "%s-%s" ($.Values.name | default $.Release.Name) ("DEFAULT_RMW_ZENOH_SESSION_CONFIG.json5")) }}"
      {{- if and .Values.rosParamFileMountPath .Values.rosParamFileData }}
      - name: "{{ include "rfc1123CompliantName" (.Values.rosParamFileMountPath | base) }}"
        configMap:
          name: "{{ include "rfc1123CompliantName" (printf "%s-%s" (.Values.name | default .Release.Name) (.Values.rosParamFileMountPath | base)) }}"
      {{- end }}
      {{- range .Values.volumes }}
      {{- if or (and .data (not (empty (tpl .data $)))) .hostPath }}
      - name: "{{ include "rfc1123CompliantName" (.mountPath | base) }}"
      {{- if .data }}
        configMap:
          name: "{{ include "rfc1123CompliantName" (printf "%s-%s" ($.Values.name | default $.Release.Name) (.mountPath | base)) }}"
      {{- else if .hostPath }}
        hostPath:
          path: "{{ tpl .hostPath $ }}"
      {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
