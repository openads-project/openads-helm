apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/controller: {{ .Files.Get "files/controller.py" | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: controller
        image: python:3.12-slim-bookworm
        command: [python3, -u, /config/controller.py]
        securityContext:
          privileged: true
          runAsUser: 0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - "import json,os,sys,time; sys.path.insert(0,'/config'); from controller import check_interval; c=json.load(open('/config/config.json')); assert time.time()-os.path.getmtime('/tmp/ready') < max(15,3*check_interval(c['checkInterval']))"
          periodSeconds: 5
          failureThreshold: 1
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: cgroups
          mountPath: /host-cgroup
        - name: cpu
          mountPath: /host-cpu
      volumes:
      - name: config
        configMap:
          name: {{ .Release.Name }}-config
      - name: cgroups
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: cpu
        hostPath:
          path: /sys/devices/system/cpu
          type: Directory
