{{- $zenohRouter := index .Values "zenoh-router" }}
{{- $netem := .Values.netem }}
{{- $hasInstances := gt (len $zenohRouter.openadservice.instances) 0 }}
{{- $instances := $zenohRouter.openadservice.instances | default (dict "" (dict)) }}
{{- range $instanceKey, $instance := $instances }}
{{- $service := mergeOverwrite (deepCopy $zenohRouter.openadservice) $instance }}
{{- $baseName := include "openadservice.baseName" (dict "name" $zenohRouter.openadservice.name "releaseName" $.Release.Name "namePrefix" $zenohRouter.openadservice.namePrefix) }}
{{- $name := include "openadservice.instanceName" (dict "baseName" $baseName "instanceKey" $instanceKey "hasInstances" $hasInstances) }}
{{- $_ := set $service "name" $name }}
{{- if and $service.enable (not $service.enableService) }}
{{- $nodePorts := list }}
{{- range $service.ports }}
{{- if not .hostPort }}
{{- $nodePorts = append $nodePorts . }}
{{- end }}
{{- end }}
{{- if $nodePorts }}
apiVersion: v1
kind: Service
{{- $externalName := printf "%s-external" $name }}
metadata:
  name: "{{ $externalName }}"
  labels:
    app.kubernetes.io/name: "{{ $externalName }}"
    {{- range $key, $value := $service.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ $name }}"
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    {{- range $nodePorts }}
    - name: "{{ .protocol | default "TCP" | lower }}-{{ .port }}-{{ .targetPort }}"
      nodePort: {{ .nodePort }}
      port: {{ .port | default .targetPort }}
      targetPort: {{ .targetPort }}
      protocol: "{{ .protocol | default "TCP" }}"
    {{- end }}
{{- end }}
---
{{- if or $service.expose (and $netem.enabled $netem.http.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ $name }}"
  labels:
    app.kubernetes.io/name: "{{ $name }}"
    {{- range $key, $value := $service.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    app.kubernetes.io/name: "{{ $name }}"
  type: ClusterIP
  ports:
    {{- range $service.expose }}
    - name: "{{ .protocol | default "TCP" | lower }}-{{ .port }}-{{ .targetPort }}"
      port: {{ .port | default .targetPort }}
      targetPort: {{ .targetPort }}
      protocol: "{{ .protocol | default "TCP" }}"
    {{- end }}
    {{- if and $netem.enabled $netem.http.enabled }}
    - name: netem-http
      port: {{ $netem.http.port }}
      targetPort: {{ $netem.http.port }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
{{- if and $service.enable $netem.enabled $netem.http.enabled $netem.http.nodePort }}
{{- $netemServiceName := include "openadservice.rfc1123CompliantName" (printf "%s-netem" $name) }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $netemServiceName }}"
  labels:
    app.kubernetes.io/name: "{{ $netemServiceName }}"
spec:
  selector:
    app.kubernetes.io/name: "{{ $name }}"
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: netem-http
      port: {{ $netem.http.port }}
      targetPort: {{ $netem.http.port }}
      nodePort: {{ $netem.http.nodePort }}
      protocol: TCP
{{- end }}
---
{{- end }}
