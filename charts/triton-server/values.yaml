openadservice:
  name: triton-server
  image: nvcr.io/nvidia/tritonserver:26.05-py3
  gpu: true
  shm: true
  args:
  - tritonserver
  - --model-repository=/models
  - --allow-client-shm=true
  - --grpc-port=8001
  - --http-port=8000
  - --metrics-port=8002
  - --log-verbose=0
  expose:
  - targetPort: 8000
  - targetPort: 8001
  - targetPort: 8002
  # volumes:
  # - mountPath: /models
  #   imagePath: models
  #   image: ghcr.io/openads-project/point_cloud_object_detection/model:v1.0.0
