openadservice:
  name: triton-server
  image: nvcr.io/nvidia/tritonserver:26.01-py3
  gpu: true
  shm: true
  args:
  - tritonserver
  - --model-repository=/models
  - --grpc-port=8001
  - --http-port=8000
  - --metrics-port=8002
  - --log-verbose=0
  expose:
  - targetPort: 8000
  - targetPort: 8001
  - targetPort: 8002
  volumes:
  - mountPath: /models
    hostPath: "{{ .Values.tritonServerModelsHostPath }}"

  # tritonModelsHostPath is the host path where models are stored, to be mounted into the container
  tritonServerModelsHostPath: null
