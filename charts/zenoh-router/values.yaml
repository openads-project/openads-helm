openadservice:
  # For a multi-node deployment example using openadservice.instances, see values.multinode.yaml
  name: zenoh-router
  image: rwthika/ros2:jazzy-ros-base-alternative-rmw
  env:
    RMW_IMPLEMENTATION: rmw_zenoh_cpp
    RUST_LOG: zenoh=info,zenoh_transport=debug
    ZENOH_ROUTER_CONFIG_URI: /DEFAULT_RMW_ZENOH_ROUTER_CONFIG.json5
  args:
  - ros2
  - run
  - rmw_zenoh_cpp
  - rmw_zenohd
  expose:
  - targetPort: 7447
  volumes:
  - mountPath: /DEFAULT_RMW_ZENOH_ROUTER_CONFIG.json5
    configMapName: '{{ include "openadservice.rfc1123CompliantName" (printf "%s-%s" (.Values.name | default .Release.Name) "DEFAULT_RMW_ZENOH_ROUTER_CONFIG.json5") }}'

# endpoints is a list of endpoints the Zenoh router will connect to, e.g., `tcp/localhost:7447`
endpoints: []

# enableAccessControl enables the Zenoh router's access control list, which allows to specify which ROS topics, services and actions are allowed or denied by the router; if set to false, all topics, services and actions are allowed
enableAccessControl: true

# allowedRosTopics is a list of ROS topics that are allowed by the Zenoh router's access control list; all other topics are denied; if all of allowedRosTopics/Services/Actions are empty, no access control is applied
allowedRosTopics: []

# allowedRosServices is a list of ROS services that are allowed by the Zenoh router's access control list; all other services are denied; if all of allowedRosTopics/Services/Actions are empty, no access control is applied
allowedRosServices: []

# allowedRosActions is a list of ROS actions that are allowed by the Zenoh router's access control list; all other actions are denied; if all of allowedRosTopics/Services/Actions are empty, no access control is applied
allowedRosActions: []
