{{- if .Values.flows }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: controller
        image: nicolaka/netshoot:v0.14
        command: [python3, -u, /controller/controller.py, /controller/config.json]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN]
        ports:
        - name: netem-http
          containerPort: {{ .Values.http.port }}
        readinessProbe:
          httpGet:
            path: /health
            port: netem-http
        volumeMounts:
        - name: controller
          mountPath: /controller
          readOnly: true
      volumes:
      - name: controller
        configMap:
          name: {{ .Release.Name }}
{{- end }}
